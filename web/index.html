<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TeayRub: draw it, guess it</title>
  <link rel="icon" type="image/jpeg" href="icon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="banner" hidden>Connection lost. Reconnecting…</div>

  <!-- ===================== HOME ===================== -->
  <main id="home" class="screen">
    <section class="hero">
      <img class="logo-img" src="logo.jpg" alt="TeayRub">
      <svg class="squiggle" viewBox="0 0 300 14" aria-hidden="true"><path d="M3 8 Q 18 -2 33 8 T 63 8 T 93 8 T 123 8 T 153 8 T 183 8 T 213 8 T 243 8 T 273 8 T 297 8" fill="none" stroke="#ff4f8b" stroke-width="5" stroke-linecap="round"/></svg>
      <p class="tagline">Everyone takes a turn drawing a secret word. Everyone else races to guess it.</p>

      <div class="card start-card">
        <label class="field">Your name
          <input id="name" maxlength="16" placeholder="Sokha" autocomplete="off">
        </label>
        <button id="btn-create" class="btn primary big">Create a room</button>
        <div class="divider"><span>or join friends</span></div>
        <div class="join-row">
          <input id="code" maxlength="5" placeholder="Room code" autocapitalize="characters" autocomplete="off" aria-label="Room code">
          <button id="btn-join" class="btn">Join</button>
        </div>
      </div>
    </section>

    <section class="boards">
      <div class="card">
        <h2>Leaderboard</h2>
        <ol id="lb" class="lb"></ol>
        <p id="lb-empty" class="empty" hidden>No matches yet. Finish a game to get on the board.</p>
      </div>
      <div class="card">
        <h2>Hall of fame</h2>
        <div id="gallery" class="gallery"></div>
        <p id="gallery-empty" class="empty" hidden>Drawings that get guessed are saved here.</p>
      </div>
    </section>
  </main>

  <!-- ===================== GAME ===================== -->
  <main id="game" class="screen" hidden>
    <header class="topbar">
      <button id="room-code" class="chip" title="Copy invite link" aria-label="Copy invite link"></button>
      <div id="round" class="round"></div>
      <div id="word" class="word"></div>
      <div class="timer" aria-live="off"><span id="time"></span><div class="bar"><i id="bar"></i></div></div>
      <button id="btn-leave" class="btn small">Leave</button>
    </header>

    <div class="layout">
      <aside class="players card">
        <h2>Players</h2>
        <ul id="players"></ul>
      </aside>

      <section class="stage">
        <div class="board">
          <canvas id="canvas" width="800" height="600" aria-label="Drawing board"></canvas>
          <div id="overlay" class="overlay" hidden></div>
        </div>
        <div id="tools" class="tray" hidden>
          <div id="colors" class="colors"></div>
          <div id="sizes" class="sizes"></div>
          <button id="btn-eraser" class="btn small" aria-pressed="false">Eraser</button>
          <button id="btn-clear" class="btn small danger">Clear</button>
        </div>
      </section>

      <aside class="chat card">
        <ul id="log"></ul>
        <form id="chat-form" autocomplete="off">
          <input id="chat-input" maxlength="100" placeholder="Type your guess" aria-label="Type your guess">
          <button class="btn primary">Send</button>
        </form>
      </aside>
    </div>
    <footer id="foot" class="foot"></footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
