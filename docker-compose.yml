# Local stack that mimics the cloud design:
#   nginx (stand-in for the ALB)  ->  2 stateless game servers ("AZ-1" / "AZ-2")  ->  Redis
# Open http://localhost:8080 in two browser tabs: they will usually land on different servers,
# and strokes still sync because of Redis Pub/Sub.
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  server1: &server
    build: { context: ., dockerfile: server/Dockerfile }
    environment:
      REDIS_URL: redis://redis:6379
      TASK_ID: server1
      AZ: local-az-1
      DRAW_MS: "60000"
    depends_on: [redis]
  server2:
    <<: *server
    environment:
      REDIS_URL: redis://redis:6379
      TASK_ID: server2
      AZ: local-az-2
      DRAW_MS: "60000"

  lb:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [server1, server2]
